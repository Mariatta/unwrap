name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # tests/fixtures/ is gitignored, so it must be regenerated here.
      # The suite cannot run without it.
      - run: npm run fixtures

      - run: npm test
